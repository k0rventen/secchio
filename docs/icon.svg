<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Minimal icon of a brown gopher with a red umbrella launching small blue cylinders into a red bucket">
  <defs>
    <!-- Reusable small blue data cylinder -->
    <g id="cylinder">
      <!-- Cylinder body -->
      <path d="M -18,-18 L -18,18 A 18,8 0 0 0 18,18 L 18,-18 Z" fill="#3B82F6" stroke="#231F20" stroke-width="7" stroke-linejoin="round"/>
      <!-- Subtle side highlight -->
      <path d="M -10,-10 L -10,15" fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
      <!-- Cylinder top cap -->
      <ellipse cx="0" cy="-18" rx="18" ry="8" fill="#60A5FA" stroke="#231F20" stroke-width="7"/>
    </g>

    <!-- Clip path so the third cylinder sits inside the bucket mouth -->
    <clipPath id="bucket-mouth-clip">
      <path d="M 310,200 L 460,200 L 442,316 A 58,17 0 0 1 326,316 Z"/>
    </clipPath>
  </defs>

  <!-- Soft circular icon badge -->
  <circle cx="256" cy="256" r="256" fill="#F5F0EB"/>




  <!-- ================= BROWN GOPHER (Restic / Go Gopher style) ================= -->
  <!-- Ears -->
  <circle cx="112" cy="218" r="22" fill="#A67449" stroke="#231F20" stroke-width="9"/>
  <circle cx="112" cy="218" r="10" fill="#7D5230"/>
  <circle cx="224" cy="218" r="22" fill="#A67449" stroke="#231F20" stroke-width="9"/>
  <circle cx="224" cy="218" r="10" fill="#7D5230"/>

  <!-- Feet -->
  <ellipse cx="128" cy="436" rx="24" ry="13" fill="#855834" stroke="#231F20" stroke-width="9"/>
  <ellipse cx="208" cy="436" rx="24" ry="13" fill="#855834" stroke="#231F20" stroke-width="9"/>

  <!-- Continuous bean-shaped gopher body -->
  <path d="M 96,268 C 96,192 240,192 240,268 L 246,386 C 248,424 220,438 168,438 C 116,438 88,424 90,386 Z" fill="#A67449" stroke="#231F20" stroke-width="9" stroke-linejoin="round"/>

  <!-- Lighter tan belly -->
  <ellipse cx="168" cy="390" rx="44" ry="34" fill="#DFC29F"/>

  <!-- Eyes (large iconic Go gopher eyes looking toward the launch) -->
  <circle cx="142" cy="264" r="26" fill="#FFFFFF" stroke="#231F20" stroke-width="8"/>
  <circle cx="198" cy="264" r="26" fill="#FFFFFF" stroke="#231F20" stroke-width="8"/>
  <circle cx="150" cy="262" r="11" fill="#231F20"/>
  <circle cx="206" cy="262" r="11" fill="#231F20"/>
  <circle cx="153" cy="258" r="4" fill="#FFFFFF"/>
  <circle cx="209" cy="258" r="4" fill="#FFFFFF"/>

  <!-- Buck teeth -->
  <rect x="155" y="310" width="28" height="22" rx="4" fill="#FFFFFF" stroke="#231F20" stroke-width="7"/>
  <line x1="169" y1="312" x2="169" y2="330" stroke="#231F20" stroke-width="6"/>

  <!-- Tan snout / muzzle -->
  <ellipse cx="169" cy="304" rx="28" ry="17" fill="#E5CAA8" stroke="#231F20" stroke-width="8"/>
  <!-- Oval nose -->
  <ellipse cx="169" cy="295" rx="13" ry="8" fill="#231F20"/>

  <!-- Left arm holding the umbrella shaft -->
  <path d="M 104,334 Q 90,300 90,282" fill="none" stroke="#231F20" stroke-width="28" stroke-linecap="round"/>
  <path d="M 104,334 Q 90,300 90,282" fill="none" stroke="#A67449" stroke-width="12" stroke-linecap="round"/>

  <!-- Right arm raised launching the cylinders -->
  <path d="M 230,342 Q 254,322 258,296" fill="none" stroke="#231F20" stroke-width="28" stroke-linecap="round"/>
  <path d="M 230,342 Q 254,322 258,296" fill="none" stroke="#A67449" stroke-width="12" stroke-linecap="round"/>
  <circle cx="258" cy="294" r="13" fill="#855834" stroke="#231F20" stroke-width="8"/>


  <!-- ================= RED UMBRELLA ================= -->
  <g transform="rotate(19 20 150)">
    <!-- Umbrella shaft & J-handle -->
    <path d="M 132,68 L 132,292 A 18,18 0 0 1 96,292 L 96,282" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Canopy dome -->
    <path d="M 28,144 C 28,78 236,78 236,144 Q 201,126 167,144 Q 132,126 97,144 Q 63,126 28,144 Z" fill="#E03B3B" stroke="#231F20" stroke-width="9" stroke-linejoin="round"/>
    <!-- Center canopy panel for depth -->
    <path d="M 132,68 C 106,88 97,116 97,144 Q 132,126 167,144 C 167,116 158,88 132,68 Z" fill="#E03B3B" stroke="#231F20" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <circle cx="90" cy="280" r="13" fill="#855834" stroke="#231F20" stroke-width="8"/>

  <!-- ================= RED BUCKET ================= -->
  <g transform="rotate(-6 384 372)">
    <!-- Bucket back opening (dark interior) -->
    <ellipse cx="384" cy="316" rx="58" ry="17" fill="#8C1D1D" stroke="#231F20" stroke-width="9"/>

    <!-- Cylinder #3 landing inside the bucket mouth -->
    <g clip-path="url(#bucket-mouth-clip)">
      <use href="#cylinder" transform="translate(386, 298) rotate(38) scale(0.95)"/>
    </g>

    <!-- Bucket tapered body -->
    <path d="M 326,316 L 340,424 A 44,14 0 0 0 428,424 L 442,316 A 58,17 0 0 1 326,316 Z" fill="#E03B3B" stroke="#231F20" stroke-width="9" stroke-linejoin="round"/>

    <!-- Bucket front highlight -->
    <path d="M 346,342 L 354,408" fill="none" stroke="#F87171" stroke-width="8" stroke-linecap="round"/>

    <!-- Bucket front rim lip -->
    <path d="M 322,316 A 30,19 0 0 0 446,316" fill="none" stroke="#444" stroke-width="9" stroke-linecap="round"/>

  </g>

  <!-- ================= LAUNCHED BLUE CYLINDERS ================= -->
  <!-- Cylinder #1: just launched from paw -->
  <use href="#cylinder" transform="translate(284, 232) rotate(-32) scale(0.95)"/>

  <!-- Cylinder #2: mid-air at the apex -->
  <use href="#cylinder" transform="translate(348, 196) rotate(16) scale(0.95)"/>
</svg>
