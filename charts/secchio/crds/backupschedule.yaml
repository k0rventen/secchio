apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupschedules.secchio.cocointhe.cloud
  labels:
    app: secchio-operator
spec:
  group: secchio.cocointhe.cloud
  names:
    kind: BackupSchedule
    listKind: BackupScheduleList
    plural: backupschedules
    singular: backupschedule
    shortNames:
      - bks
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: All OK
          type: boolean
          jsonPath: .status.allOk
        - name: Total
          type: integer
          jsonPath: .status.summary.totalBackups
        - name: Healthy
          type: integer
          jsonPath: .status.summary.healthyBackups
        - name: Failed
          type: integer
          jsonPath: .status.summary.failedBackups
        - name: Last Backup
          type: string
          jsonPath: .status.lastBackupTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - pvc
                - repo
                - schedule
              properties:
                pvc:
                  type: object
                  description: Label selector to match PVCs in the schedule's namespace
                  required:
                    - selector
                  properties:
                    selector:
                      type: object
                      description: Label selector to match PVCs
                      minProperties: 1
                      additionalProperties:
                        type: string
                schedule:
                  type: string
                  description: Cron expression for backup schedule (e.g. 0 2 * * *)
                  minLength: 1
                  pattern: '^(@(yearly|annually|monthly|weekly|daily|midnight|hourly)|(\S+\s+){4}\S+)$'
                timeZone:
                  type: string
                  description: >-
                    IANA timezone name for the schedule (e.g. Europe/Brussels).
                    Defaults to the controller's timezone (UTC) when omitted.
                  pattern: '^[A-Za-z0-9_+\-]+(/[A-Za-z0-9_+\-]+)*$'
                repo:
                  type: object
                  required:
                    - secretName
                    - endpoint
                  properties:
                    endpoint:
                      type: string
                      description: Full S3 endpoint URL (my-s3.my-domain/bucket)
                      minLength: 1
                    secretName:
                      type: string
                      description: Kubernetes Secret with AWS credentials
                      minLength: 1
                    insecureTLS:
                      type: boolean
                      description: Skip TLS verification when talking to the S3 endpoint
                      default: false
                retention:
                  type: object
                  description: GFS retention policy (restic forget args)
                  properties:
                    keepDaily:
                      type: integer
                      minimum: 0
                    keepWeekly:
                      type: integer
                      minimum: 0
                    keepMonthly:
                      type: integer
                      minimum: 0
                    keepYearly:
                      type: integer
                      minimum: 0
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Overall health phase (Healthy/Degraded/Running/Pending)
                allOk:
                  type: boolean
                  description: True if all backups under this schedule are healthy
                lastBackupTime:
                  type: string
                  description: Timestamp of the most recent backup across all PVCs
                message:
                  type: string
                  description: Summary description of schedule health
                summary:
                  type: object
                  description: Backup count summary
                  properties:
                    totalBackups:
                      type: integer
                    healthyBackups:
                      type: integer
                    failedBackups:
                      type: integer
                    runningBackups:
                      type: integer
                backups:
                  type: array
                  description: Per-PVC backup status
                  items:
                    type: object
                    properties:
                      pvcName:
                        type: string
                        description: PVC this entry tracks
                      cronjobName:
                        type: string
                        description: CronJob that backs up this PVC
                      phase:
                        type: string
                        description: Current phase (Pending/Running/Completed/Failed)
                      lastBackupTime:
                        type: string
                        description: Timestamp of the last backup completion
                      snapshots:
                        type: array
                        description: Available snapshots in the restic repository
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            time:
                              type: string
                            size:
                              type: integer
                      message:
                        type: string
                        description: Status or error details
                      reason:
                        type: string
                        description: Machine-readable failure reason
