apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: restores.secchio.cocointhe.cloud
  labels:
    app: secchio-operator
spec:
  group: secchio.cocointhe.cloud
  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    singular: restore
    shortNames:
      - rt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.scheduleName
        - name: PVC
          type: string
          jsonPath: .spec.pvcName
        - name: Target PVC
          type: string
          jsonPath: .spec.targetPVC
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Snapshot ID
          type: string
          jsonPath: .status.snapshotID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - scheduleName
                - pvcName
              properties:
                scheduleName:
                  type: string
                  description: BackupSchedule that owns the source PVC
                  minLength: 1
                pvcName:
                  type: string
                  description: Source PVC to restore from
                  minLength: 1
                targetPVC:
                  type: string
                  description: Target PVC to restore into (defaults to pvcName)
                snapshotID:
                  type: string
                  description: Optional specific snapshot ID to restore (defaults to latest)
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase (Pending/Running/Completed/Failed)
                startTime:
                  type: string
                  description: Timestamp when restore started
                completionTime:
                  type: string
                  description: Timestamp when restore completed
                snapshotID:
                  type: string
                  description: Restored restic snapshot ID
                message:
                  type: string
                  description: Status message or error
