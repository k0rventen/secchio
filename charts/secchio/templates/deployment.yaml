apiVersion: apps/v1
kind: Deployment
metadata:
  name: secchio-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: secchio-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: secchio-operator
  template:
    metadata:
      labels:
        app: secchio-operator
    spec:
      serviceAccountName: secchio-operator
      automountServiceAccountToken: true
      containers:
        - name: secchio
          image: "{{ .Values.operator.image }}:{{ .Values.operator.tag }}"
          env:
            - name: RESTIC_IMAGE
              value: "{{ .Values.restic.image }}:{{ .Values.restic.tag }}"
            - name: OPERATOR_VERSION
              value: "{{ .Chart.AppVersion }}"
          ports:
          - name: http
            containerPort: 8000
          - name: health
            containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: secchio-ui
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: "http"
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: secchio-operator
