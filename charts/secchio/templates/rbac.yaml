# service account for the operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secchio-operator
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secchio-operator
  labels:
    app: secchio-operator
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - events
  - secrets
  verbs:
  - '*'
# - apiGroups:
#   - apps
#   resources:
#   - deployments
#   - daemonsets
#   - statefulsets
#   verbs:
#   - '*'
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - '*'
- apiGroups:
  - secchio.cocointhe.cloud
  resources:
  - '*'
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secchio-operator
  labels:
    app: secchio-operator
subjects:
- kind: ServiceAccount
  name: secchio-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: secchio-operator
  apiGroup: rbac.authorization.k8s.io
