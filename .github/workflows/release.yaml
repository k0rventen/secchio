name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 1. Verify the tag version matches the chart version before building/releasing.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify versions match tag
        run: |
          tag_version="${GITHUB_REF#refs/tags/}"
          tag_clean="${tag_version#v}"

          chart_version="$(grep -m1 '^version:' charts/secchio/Chart.yaml | sed 's/^[^:]*:[[:space:]]*//')"
          pyproject_version="$(cat pyproject.toml | grep -E '^version\W+=' | cut -d'=' -f2 | tr -d '"' | tr -d ' ')"

          echo "Tag version:      $tag_version (clean: $tag_clean)"
          echo "Chart version:    $chart_version"
          echo "Pyproject version: $pyproject_version"

          if [ "$tag_clean" != "$chart_version" ]; then
            echo "::error::Chart version ($chart_version) does not match tag ($tag_version)"
            exit 1
          fi

          if [ "$tag_clean" != "$pyproject_version" ]; then
            echo "::error::Pyproject version ($pyproject_version) does not match tag ($tag_version)"
            exit 1
          fi

  # 2. Build and push the operator image with a semver tag.
  oci-images-build:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      operator_digest: ${{ steps.build-operator.outputs.digest }}
      restic_digest: ${{ steps.build-restic.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      -
        name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      -
        name: Build and push operator
        id: build-operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-operator:${{ github.ref_name }}
      -
        name: Sign operator image
        run: cosign sign --yes ghcr.io/${{ github.repository }}-operator:${{ github.ref_name }}@${{ steps.build-operator.outputs.digest }}
      -
        name: Build and push restic
        id: build-restic
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./restic-pod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-restic:${{ github.ref_name }}
      -
        name: Sign restic image
        run: cosign sign --yes ghcr.io/${{ github.repository }}-restic:${{ github.ref_name }}@${{ steps.build-restic.outputs.digest }}


  helm-chart-build:
    needs:
      - version-check
      - oci-images-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Pin image digests
        env:
          OPERATOR_TAG: ${{ github.ref_name }}@${{ needs.oci-images-build.outputs.operator_digest }}
          RESTIC_TAG: ${{ github.ref_name }}@${{ needs.oci-images-build.outputs.restic_digest }}
        run: |
          if [ -z "${{ needs.oci-images-build.outputs.operator_digest }}" ] || \
             [ -z "${{ needs.oci-images-build.outputs.restic_digest }}" ]; then
            echo "::error::image digests are missing"
            exit 1
          fi
          yq -i '.operator.tag = strenv(OPERATOR_TAG) | .restic.tag = strenv(RESTIC_TAG)' \
            charts/secchio/values.yaml
          grep -E '^  tag:' charts/secchio/values.yaml

      - name: Run chart-releaser
        uses: bitdeps/helm-oci-charts-releaser@caedceea2a5ab997c7e5469a999811dbb3d5b070 # v0.1.5
        with:
            oci_registry: ghcr.io/${{ github.repository_owner }}
            oci_username: ${{ github.repository_owner }}
            oci_password: ${{ secrets.GITHUB_TOKEN }}
            github_token: ${{ secrets.GITHUB_TOKEN }}
            skip_gh_release: true


  release-notes:
    needs:
      - version-check
      - oci-images-build
      - helm-chart-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: generate changelog
        id: changelog
        uses: requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1.10.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          includeInvalidCommits: true
          useGitmojis: false


      - name: create release with changelog
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          makeLatest: true
          draft: false
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ secrets.GITHUB_TOKEN }}
