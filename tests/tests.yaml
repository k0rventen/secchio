apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: lol-app
  name: lol-app
  namespace: production
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 3Gi
  storageClassName: longhorn-luks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lol-app
  labels:
    app: lol-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lol-app
  template:
    metadata:
      labels:
        app: lol-app
    spec:
      containers:
        - name: lol-app
          image: nginx
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: lol-app

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: python-test-app
  name: python-test-app3
  namespace: testing
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: notes-app
  name: python-test-app
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: secchio.cocointhe.cloud/v1alpha1
kind: BackupSchedule
metadata:
  name: python-notes
spec:
  pvc:
    selector:
      app: notes-app
  repo:
    endpoint: 192.168.1.20/backups
    insecureTLS: true
    secretName: restic-s3-secret
  retention:
    keepDaily: 2
  schedule: '30 23 * * *'
  suspend: false
  timeZone: Europe/Paris
