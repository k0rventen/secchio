# In-cluster S3
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: garage
  labels:
    app: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.6.0
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          env:
            - name: GARAGE_DEFAULT_ACCESS_KEY
              value: e2e-secchio-access-key
            - name: GARAGE_DEFAULT_SECRET_KEY
              value: e2e-secchio-secret-key
            - name: GARAGE_DEFAULT_BUCKET
              value: secchio-e2e
            - name: GARAGE_RPC_SECRET
              value: ed5485f411360adc02540f87fa6d75fba1519231563828090b2c497d31559ec4
            - name: GARAGE_ADMIN_TOKEN
              value: KlWZtREVh3SB
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: data
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
