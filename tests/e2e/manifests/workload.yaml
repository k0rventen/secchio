# The PVC and pod the e2e test backs up. The script writes /data/data.txt.
apiVersion: v1
kind: Namespace
metadata:
  name: secchio-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: restic-s3-secret
  namespace: secchio-e2e
type: Opaque
stringData:
  RESTIC_PASSWORD: e2e-restic-password
  AWS_ACCESS_KEY_ID: e2e-secchio-access-key
  AWS_SECRET_ACCESS_KEY: e2e-secchio-secret-key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e2e-data
  namespace: secchio-e2e
  labels:
    app: secchio-e2e
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-workload
  namespace: secchio-e2e
  labels:
    app: e2e-workload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: e2e-workload
  template:
    metadata:
      labels:
        app: e2e-workload
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: e2e-data
