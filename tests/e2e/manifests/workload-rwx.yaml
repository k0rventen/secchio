apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e2e-data-rwx
  namespace: secchio-e2e
  labels:
    app: secchio-e2e
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-workload-rwx
  namespace: secchio-e2e
  labels:
    app: e2e-workload-rwx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: e2e-workload-rwx
  template:
    metadata:
      labels:
        app: e2e-workload-rwx
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: e2e-data-rwx
